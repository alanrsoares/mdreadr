name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `postinstall` runs `electrobun prepare`, which downloads the Hutch
      # toolchain (Electrobun core plus a pinned Bun) on a cold machine. Keyed
      # on the pinned electrobun version, so a bump invalidates it.
      - name: Cache Hutch toolchain
        uses: actions/cache@v4
        with:
          path: ~/.hutch
          key: hutch-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json') }}

      - run: bun install --frozen-lockfile

      # Generated (gitignored) theme output that ColorSchemeContext.tsx
      # imports — typecheck fails on a fresh checkout without this.
      - name: Build theme
        run: bun run theme:build

      - name: Lint + typecheck + test
        run: bun run check

      # Webview production bundle gate: catches Vite/module-resolution issues
      # that lint, typecheck, and tests all miss, without needing the
      # Electrobun native packaging step (that's the package job's).
      - name: Webview production bundle
        run: bun run vite build

  # release.yml packages the app, but it only runs after release-please has
  # already cut the tag — so a packaging bug becomes a published release with
  # missing or broken assets, which is how v0.11.0 and v0.12.0 shipped. Prove
  # the app packages and boots before the PR lands.
  #
  # Both shipped platforms, because one is not enough: the Electrobun 2 upgrade
  # passed a Linux-only gate and then failed both macOS release builds, so
  # v0.13.1 shipped with no macOS assets at all.
  package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      # A macOS packaging failure says nothing about Linux, and vice versa.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          # Apple Silicon only: Hutch has no darwin-x64 toolchain, so there is
          # no Intel Mac target to gate. See release.yml.
          - os: macos-latest
            platform: macos
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # Runtime libraries only — nothing here is compiled from source, the
          # electrobun native bits ship prebuilt. xvfb gives the smoke test a
          # display to open a real window against.
          sudo apt-get install -y libgtk-3-0t64 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 zenity xvfb

      # `postinstall` runs `electrobun prepare`, which downloads the Hutch
      # toolchain (Electrobun core plus a pinned Bun) on a cold machine. Keyed
      # on the pinned electrobun version, so a bump invalidates it.
      - name: Cache Hutch toolchain
        uses: actions/cache@v4
        with:
          path: ~/.hutch
          key: hutch-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json') }}

      - run: bun install --frozen-lockfile

      - name: Build Application
        run: bun run build

      - name: Smoke test the built app
        run: bun run scripts/smoke-test.ts
