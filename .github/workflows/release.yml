name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing tag to attach assets to — backfills a release whose build job failed"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node

  build:
    name: Build (${{ matrix.os }})
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing says nothing about the others, and finding out
      # about all of them in a single run beats re-running per platform.
      fail-fast: false
      matrix:
        include:
          # macos-latest is Apple Silicon; macos-15-intel keeps Intel Macs
          # covered (GitHub retired the older macos-13 x64 image).
          - os: macos-latest
            platform: macos
          - os: macos-15-intel
            platform: macos
          - os: ubuntu-latest
            platform: linux
          - os: ubuntu-24.04-arm
            platform: linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          # Runtime libraries only — nothing here is compiled from source, the
          # electrobun native bits ship prebuilt. xvfb gives the smoke test a
          # display to open a real window against.
          sudo apt-get install -y libgtk-3-0t64 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 zenity xvfb

      # `postinstall` runs `electrobun prepare`, which downloads the Hutch
      # toolchain (Electrobun core plus a pinned Bun) on a cold machine. Keyed
      # on the pinned electrobun version, so a bump invalidates it.
      - name: Cache Hutch toolchain
        uses: actions/cache@v4
        with:
          path: ~/.hutch
          key: hutch-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package.json') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build theme
        run: bun run theme:build

      - name: Run check (Lint, Typecheck, Test)
        run: bun run check

      - name: Build Application
        run: bun run build

      # Lint, typecheck, tests and the Vite bundle all pass on a build that
      # cannot actually start — a bad native bundle, a broken entrypoint, a
      # missing copied asset. Boot the real artifact and require it to stay up.
      - name: Smoke test the built app
        run: bun run scripts/smoke-test.ts

      - name: Upload Release Asset
        if: ${{ needs.release-please.outputs.release_created || inputs.tag_name }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name || inputs.tag_name }}
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
